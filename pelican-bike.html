<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pelican on a Bicycle</title>
  <style>
    /* Reset & Viewport setup */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0c1013;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    .viewport-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    svg.pelican-stage {
      width: 100%;
      height: 100%;
      display: block;
      transform-box: view-box;
    }

    /* UI Badge */
    .title-badge {
      position: absolute;
      top: 24px;
      left: 28px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 9px 20px 9px 16px;
      border-radius: 50px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.9);
      z-index: 20;
    }

    .title-badge .badge-icon {
      font-size: 22px;
      line-height: 1;
    }

    .title-badge .badge-text {
      display: flex;
      flex-direction: column;
    }

    .title-badge .badge-title {
      font-size: 14px;
      font-weight: 800;
      color: #1e272e;
      letter-spacing: 0.4px;
    }

    .title-badge .badge-subtitle {
      font-size: 11px;
      font-weight: 600;
      color: #00b894;
      letter-spacing: 0.2px;
    }

    /* ================= KEYFRAME ANIMATIONS ================= */

    /* Parallax Background Scrolling */
    @keyframes scrollScene {
      0% {
        transform: translate3d(0, 0, 0);
      }
      100% {
        transform: translate3d(-1200px, 0, 0);
      }
    }

    .scroll-clouds {
      animation: scrollScene 45s linear infinite;
      will-change: transform;
    }

    .scroll-hills {
      animation: scrollScene 22s linear infinite;
      will-change: transform;
    }

    .scroll-midground {
      animation: scrollScene 8.8s linear infinite;
      will-change: transform;
    }

    .scroll-road {
      /* 3.6s exactly matches 3 wheel revolutions: 1200px / (3 * 2 * pi * 63.66) = 1.0 */
      animation: scrollScene 3.6s linear infinite;
      will-change: transform;
    }

    .scroll-foreground {
      animation: scrollScene 2.4s linear infinite;
      will-change: transform;
    }

    /* Wheels & Crank Pure CSS fallback & SMIL coordination */
    @keyframes spinClockwise {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes spinCounterClockwise {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(-360deg);
      }
    }

    .wheel-rear {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: spinClockwise 1.2s linear infinite;
    }

    .wheel-front {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: spinClockwise 1.2s linear infinite;
    }

    .crank-assembly {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: spinClockwise 1.2s linear infinite;
    }

    .pedal-near-counter {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: spinCounterClockwise 1.2s linear infinite;
    }

    .pedal-far-counter {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: spinCounterClockwise 1.2s linear infinite;
    }

    /* Pelican Rider Cadence & Body Bobbing */
    @keyframes pelicanBob {
      0% {
        transform: translateY(0px) rotate(0deg);
      }
      25% {
        transform: translateY(-2.5px) rotate(-0.4deg);
      }
      50% {
        transform: translateY(1.5px) rotate(0.3deg);
      }
      75% {
        transform: translateY(-2px) rotate(-0.3deg);
      }
      100% {
        transform: translateY(0px) rotate(0deg);
      }
    }

    .pelican-rider {
      transform-box: fill-box;
      transform-origin: 33% 91%;
      animation: pelicanBob 1.2s ease-in-out infinite;
    }

    /* Wings flapping slightly */
    @keyframes wingFlapNear {
      0% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(-12deg) scaleY(0.97);
      }
      100% {
        transform: rotate(0deg);
      }
    }

    @keyframes wingFlapFar {
      0% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(-9deg) scaleY(0.97);
      }
      100% {
        transform: rotate(0deg);
      }
    }

    .pelican-wing-near {
      transform-box: fill-box;
      transform-origin: 92% 3%;
      animation: wingFlapNear 0.75s ease-in-out infinite;
    }

    .pelican-wing-far {
      transform-box: fill-box;
      transform-origin: 100% 9%;
      animation: wingFlapFar 0.75s ease-in-out infinite;
    }

    /* Pelican Pouch Wobble */
    @keyframes pouchWobble {
      0%, 100% {
        transform: scale(1, 1) rotate(0deg);
      }
      30% {
        transform: scale(1.03, 0.96) rotate(-1deg);
      }
      70% {
        transform: scale(0.97, 1.03) rotate(1.2deg);
      }
    }

    .pelican-pouch {
      transform-box: fill-box;
      transform-origin: 54% 14%;
      animation: pouchWobble 0.8s ease-in-out infinite;
    }

    /* Fluttering Scarf Tails */
    @keyframes scarfTail1 {
      0% {
        transform: rotate(0deg) skewX(0deg);
      }
      50% {
        transform: rotate(9deg) skewX(-7deg);
      }
      100% {
        transform: rotate(0deg) skewX(0deg);
      }
    }

    @keyframes scarfTail2 {
      0% {
        transform: rotate(0deg) skewX(0deg);
      }
      50% {
        transform: rotate(-8deg) skewX(6deg);
      }
      100% {
        transform: rotate(0deg) skewX(0deg);
      }
    }

    .scarf-tail-1 {
      transform-box: fill-box;
      transform-origin: 100% 50%;
      animation: scarfTail1 0.45s ease-in-out infinite;
    }

    .scarf-tail-2 {
      transform-box: fill-box;
      transform-origin: 100% 0%;
      animation: scarfTail2 0.55s ease-in-out infinite 0.1s;
    }

    /* Eye Blink */
    @keyframes eyeBlink {
      0%, 93%, 100% {
        transform: scaleY(1);
      }
      96% {
        transform: scaleY(0.08);
      }
    }

    .pelican-eye-pupil {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: eyeBlink 3.8s ease-in-out infinite;
    }

    /* Basket Fish tail wag */
    @keyframes fishTailWag {
      0%, 100% {
        transform: rotate(-12deg);
      }
      50% {
        transform: rotate(15deg);
      }
    }

    .fish-tail {
      transform-box: fill-box;
      transform-origin: 85% 50%;
      animation: fishTailWag 0.5s ease-in-out infinite;
    }

    /* Windmill blades rotation */
    .windmill-sails {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: spinClockwise 8s linear infinite;
    }

    /* Pennant flag fluttering */
    @keyframes pennantFlutter {
      0%, 100% {
        transform: scaleX(1) skewY(0deg);
      }
      50% {
        transform: scaleX(0.85) skewY(-6deg);
      }
    }

    .rear-pennant {
      transform-box: fill-box;
      transform-origin: 100% 0%;
      animation: pennantFlutter 0.35s ease-in-out infinite;
    }

    /* Bell sound wave pulses */
    @keyframes bellRing {
      0%, 75% {
        opacity: 0;
        transform: scale(0.6);
      }
      80% {
        opacity: 0.9;
      }
      100% {
        opacity: 0;
        transform: scale(1.6);
      }
    }

    .bell-ring-wave {
      transform-box: fill-box;
      transform-origin: 0% 50%;
      animation: bellRing 2.4s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
    }

    /* Sun Glow Pulse */
    @keyframes sunGlowPulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.85;
      }
      50% {
        transform: scale(1.08);
        opacity: 1;
      }
    }

    .sun-glow {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: sunGlowPulse 4s ease-in-out infinite;
    }

    /* Subtle bike vibration */
    @keyframes bikeRoadVibe {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-0.7px);
      }
    }

    .bike-body-group {
      animation: bikeRoadVibe 0.3s ease-in-out infinite;
    }
  </style>
</head>
<body>

  <div class="viewport-wrapper">
    <svg class="pelican-stage" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
      <defs>
        <!-- Sky Gradient -->
        <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#0984e3" />
          <stop offset="28%" stop-color="#48dbfb" />
          <stop offset="60%" stop-color="#70a1ff" stop-opacity="0.75" />
          <stop offset="82%" stop-color="#feca57" />
          <stop offset="100%" stop-color="#ff9f43" />
        </linearGradient>

        <!-- Sun Radial Glow -->
        <radialGradient id="sunGlowGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
          <stop offset="35%" stop-color="#fff275" stop-opacity="0.8" />
          <stop offset="70%" stop-color="#ffa502" stop-opacity="0.3" />
          <stop offset="100%" stop-color="#ff7f50" stop-opacity="0" />
        </radialGradient>

        <!-- Cloud Gradient -->
        <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="75%" stop-color="#ffffff" />
          <stop offset="100%" stop-color="#dfe4ea" />
        </linearGradient>

        <!-- Distant Mountain Gradient -->
        <linearGradient id="farHillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#a4b0be" stop-opacity="0.85" />
          <stop offset="100%" stop-color="#747d8c" stop-opacity="0.95" />
        </linearGradient>

        <linearGradient id="midHillGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#1dd1a1" />
          <stop offset="100%" stop-color="#10ac84" />
        </linearGradient>

        <linearGradient id="midHillGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#2ed573" />
          <stop offset="100%" stop-color="#05c46b" />
        </linearGradient>

        <!-- Road Surface Gradient -->
        <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#57606f" />
          <stop offset="40%" stop-color="#4b6584" />
          <stop offset="100%" stop-color="#2f3542" />
        </linearGradient>

        <!-- Bike Frame Metal Gradient (Vintage Seafoam Cruiser) -->
        <linearGradient id="bikeFrameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#55efc4" />
          <stop offset="45%" stop-color="#00cec9" />
          <stop offset="100%" stop-color="#00b894" />
        </linearGradient>

        <!-- Chrome Gradient -->
        <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="35%" stop-color="#dfe6e9" />
          <stop offset="60%" stop-color="#b2bec3" />
          <stop offset="100%" stop-color="#ffffff" />
        </linearGradient>

        <!-- Leather Saddle Gradient -->
        <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#a0522d" />
          <stop offset="45%" stop-color="#8b4513" />
          <stop offset="100%" stop-color="#5c2c16" />
        </linearGradient>

        <!-- Pelican Beak Gradient -->
        <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="40%">
          <stop offset="0%" stop-color="#f6b93b" />
          <stop offset="45%" stop-color="#e58e26" />
          <stop offset="100%" stop-color="#d35400" />
        </linearGradient>

        <!-- Pelican Pouch Gradient -->
        <linearGradient id="pouchGrad" x1="15%" y1="0%" x2="85%" y2="100%">
          <stop offset="0%" stop-color="#ffbe76" />
          <stop offset="40%" stop-color="#ff7979" />
          <stop offset="100%" stop-color="#eb4d4b" />
        </linearGradient>

        <!-- Pelican Body Gradient -->
        <linearGradient id="pelicanBodyGrad" x1="30%" y1="0%" x2="70%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="65%" stop-color="#f8f9fa" />
          <stop offset="100%" stop-color="#ced6e0" />
        </linearGradient>

        <!-- Wicker Basket Pattern -->
        <pattern id="wickerWeave" width="8" height="8" patternUnits="userSpaceOnUse">
          <rect width="8" height="8" fill="#f8c291" />
          <path d="M 0,4 L 8,4 M 4,0 L 4,8" stroke="#e58e26" stroke-width="1.2" />
        </pattern>

        <!-- TILE: CLOUDS (1200px width) -->
        <g id="clouds-tile">
          <!-- Cloud 1 -->
          <g transform="translate(80, 80) scale(1.1)">
            <ellipse cx="60" cy="40" rx="60" ry="24" fill="url(#cloudGrad)" />
            <circle cx="35" cy="28" r="28" fill="url(#cloudGrad)" />
            <circle cx="65" cy="18" r="32" fill="url(#cloudGrad)" />
            <circle cx="95" cy="28" r="24" fill="url(#cloudGrad)" />
          </g>
          <!-- Cloud 2 -->
          <g transform="translate(360, 130) scale(0.85)">
            <ellipse cx="50" cy="35" rx="55" ry="20" fill="url(#cloudGrad)" opacity="0.9" />
            <circle cx="30" cy="25" r="24" fill="url(#cloudGrad)" opacity="0.9" />
            <circle cx="60" cy="18" r="28" fill="url(#cloudGrad)" opacity="0.9" />
            <circle cx="85" cy="26" r="20" fill="url(#cloudGrad)" opacity="0.9" />
          </g>
          <!-- Cloud 3 -->
          <g transform="translate(600, 75) scale(1.25)">
            <ellipse cx="65" cy="45" rx="70" ry="26" fill="url(#cloudGrad)" />
            <circle cx="38" cy="32" r="32" fill="url(#cloudGrad)" />
            <circle cx="72" cy="18" r="38" fill="url(#cloudGrad)" />
            <circle cx="105" cy="30" r="28" fill="url(#cloudGrad)" />
          </g>
          <!-- Cloud 4 -->
          <g transform="translate(900, 140) scale(0.8)">
            <ellipse cx="45" cy="30" rx="50" ry="18" fill="url(#cloudGrad)" opacity="0.92" />
            <circle cx="28" cy="22" r="20" fill="url(#cloudGrad)" opacity="0.92" />
            <circle cx="55" cy="15" r="25" fill="url(#cloudGrad)" opacity="0.92" />
            <circle cx="78" cy="22" r="18" fill="url(#cloudGrad)" opacity="0.92" />
          </g>
          <!-- Cloud 5 -->
          <g transform="translate(1080, 95) scale(0.95)">
            <ellipse cx="55" cy="38" rx="58" ry="22" fill="url(#cloudGrad)" />
            <circle cx="32" cy="28" r="25" fill="url(#cloudGrad)" />
            <circle cx="62" cy="18" r="30" fill="url(#cloudGrad)" />
            <circle cx="90" cy="28" r="22" fill="url(#cloudGrad)" />
          </g>
        </g>

        <!-- TILE: DISTANT HILLS & HORIZON (1200px width) -->
        <g id="hills-tile">
          <path d="M 0,420 C 140,360 280,440 440,370 C 600,310 740,430 900,360 C 1040,300 1140,390 1200,420 L 1200,560 L 0,560 Z" fill="url(#farHillGrad)" />
          
          <!-- Distant Coastal Lighthouse on hill at x=460 -->
          <g transform="translate(460, 318)">
            <polygon points="-8,45 8,45 6,8 -6,8" fill="#ffffff" />
            <polygon points="-7.5,36 7.5,36 7,26 -7,26" fill="#eb4d4b" />
            <polygon points="-6.5,18 6.5,18 6,10 -6,10" fill="#eb4d4b" />
            <rect x="-6" y="2" width="12" height="6" fill="#2f3542" />
            <path d="M -7,2 Q 0,-4 7,2 Z" fill="#eb4d4b" />
            <polygon points="6,5 180,-20 180,30" fill="#fff" opacity="0.25" />
          </g>

          <!-- Distant Sailboat at x=830 -->
          <g transform="translate(830, 422) scale(0.7)">
            <path d="M -16,10 L 16,10 L 11,18 L -11,18 Z" fill="#ffffff" />
            <polygon points="-2,8 -2,-16 12,8" fill="#ffffff" />
            <polygon points="-4,8 -4,-12 -12,8" fill="#f1f2f6" />
          </g>

          <!-- Mid-distance layered hill -->
          <path d="M 0,465 C 160,410 320,480 500,435 C 680,390 840,480 1020,430 C 1120,400 1180,445 1200,465 L 1200,580 L 0,580 Z" fill="#74b9ff" opacity="0.45" />
        </g>

        <!-- TILE: MIDGROUND COUNTRYSIDE & TREES (1200px width) -->
        <g id="midground-tile">
          <path d="M 0,485 Q 220,430 450,490 T 920,470 T 1200,485 L 1200,600 L 0,600 Z" fill="url(#midHillGrad1)" />
          <path d="M 0,520 Q 300,465 620,515 T 1200,520 L 1200,600 L 0,600 Z" fill="url(#midHillGrad2)" />

          <!-- Feature 1: Deciduous Tree at x=85 -->
          <g transform="translate(85, 435)">
            <path d="M -6,55 Q -8,25 -4,0 Q 4,25 6,55 Z" fill="#6d4c41" />
            <circle cx="-16" cy="-10" r="24" fill="#009432" />
            <circle cx="16" cy="-12" r="22" fill="#05c46b" />
            <circle cx="0" cy="-28" r="26" fill="#2ed573" />
            <circle cx="-6" cy="-22" r="16" fill="#7bed9f" opacity="0.6" />
          </g>

          <!-- Feature 2: Rustic Fence at x=180 to x=320 -->
          <g transform="translate(180, 480)" stroke="#795548" stroke-linecap="round">
            <line x1="0" y1="12" x2="140" y2="8" stroke-width="3" />
            <line x1="0" y1="24" x2="140" y2="20" stroke-width="3" />
            <line x1="5" y1="5" x2="5" y2="35" stroke-width="4.5" />
            <line x1="48" y1="4" x2="48" y2="34" stroke-width="4.5" />
            <line x1="92" y1="3" x2="92" y2="33" stroke-width="4.5" />
            <line x1="135" y1="2" x2="135" y2="32" stroke-width="4.5" />
          </g>

          <!-- Feature 3: Dutch Windmill at x=440 -->
          <g transform="translate(440, 435)">
            <polygon points="-24,65 24,65 16,-10 -16,-10" fill="#f1f2f6" stroke="#ced6e0" stroke-width="1.5" />
            <rect x="-5" y="15" width="10" height="14" rx="2" fill="#2f3542" />
            <line x1="0" y1="15" x2="0" y2="29" stroke="#fff" stroke-width="1" />
            <line x1="-5" y1="22" x2="5" y2="22" stroke="#fff" stroke-width="1" />
            <path d="M -8,65 L -8,50 Q 0,44 8,50 L 8,65 Z" fill="#795548" />
            <path d="M -18,-10 Q 0,-30 18,-10 Z" fill="#eb4d4b" />
            <!-- Spinning Sails with SMIL and CSS fallback -->
            <g class="windmill-sails" transform="translate(0, -10)">
              <circle cx="0" cy="0" r="4.5" fill="#2f3542" />
              <g transform="rotate(0)">
                <line x1="0" y1="0" x2="0" y2="-45" stroke="#795548" stroke-width="2.5" />
                <rect x="2" y="-42" width="10" height="36" fill="#ffffff" opacity="0.85" stroke="#795548" stroke-width="1" />
              </g>
              <g transform="rotate(90)">
                <line x1="0" y1="0" x2="0" y2="-45" stroke="#795548" stroke-width="2.5" />
                <rect x="2" y="-42" width="10" height="36" fill="#ffffff" opacity="0.85" stroke="#795548" stroke-width="1" />
              </g>
              <g transform="rotate(180)">
                <line x1="0" y1="0" x2="0" y2="-45" stroke="#795548" stroke-width="2.5" />
                <rect x="2" y="-42" width="10" height="36" fill="#ffffff" opacity="0.85" stroke="#795548" stroke-width="1" />
              </g>
              <g transform="rotate(270)">
                <line x1="0" y1="0" x2="0" y2="-45" stroke="#795548" stroke-width="2.5" />
                <rect x="2" y="-42" width="10" height="36" fill="#ffffff" opacity="0.85" stroke="#795548" stroke-width="1" />
              </g>
            </g>
          </g>

          <!-- Feature 4: Coastal Pine Tree at x=615 -->
          <g transform="translate(615, 440)">
            <rect x="-4" y="25" width="8" height="35" fill="#4e342e" />
            <polygon points="0,-35 -24,5 24,5" fill="#1b5e20" />
            <polygon points="0,-20 -28,18 28,18" fill="#2e7d32" />
            <polygon points="0,-5 -32,32 32,32" fill="#388e3c" />
          </g>

          <!-- Feature 5: Cozy Country Cottage at x=760 -->
          <g transform="translate(760, 465)">
            <circle cx="16" cy="-22" r="4" fill="#ffffff" opacity="0.6" />
            <circle cx="20" cy="-30" r="5.5" fill="#ffffff" opacity="0.4" />
            <circle cx="25" cy="-40" r="7" fill="#ffffff" opacity="0.25" />
            <rect x="12" y="-16" width="7" height="14" fill="#b71540" />
            <rect x="-24" y="0" width="48" height="30" fill="#fdfbf7" stroke="#ced6e0" stroke-width="1" />
            <polygon points="-28,0 0,-18 28,0" fill="#e55039" />
            <rect x="-6" y="10" width="12" height="20" rx="1" fill="#795548" />
            <circle cx="3" cy="20" r="1.2" fill="#ffd32a" />
            <rect x="10" y="8" width="10" height="10" rx="1" fill="#74b9ff" stroke="#fff" stroke-width="1" />
          </g>

          <!-- Feature 6: Flowering Apple Tree at x=920 -->
          <g transform="translate(920, 435)">
            <path d="M -5,55 Q -7,25 -3,0 Q 5,25 7,55 Z" fill="#5d4037" />
            <circle cx="-14" cy="-12" r="22" fill="#20bf6b" />
            <circle cx="14" cy="-14" r="20" fill="#26de81" />
            <circle cx="0" cy="-26" r="24" fill="#10ac84" />
            <circle cx="-10" cy="-16" r="3" fill="#eb4d4b" />
            <circle cx="8" cy="-18" r="3" fill="#eb4d4b" />
